name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip project
        run: |
          ls -la
          Z=$(ls *.zip | head -n 1)
          echo "Using: $Z"
          unzip -q "$Z" -d proj
          find proj -name settings.gradle.kts
      - name: Build debug APK
        run: |
          F=$(find proj -name settings.gradle.kts | head -n 1)
          cd "$(dirname "$F")"
          gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: WidgetStackEdge-apk
          path: proj/**/build/outputs/apk/debug/*.apk
